# Terraform Provider release workflow.
#
# Runs on tag push, or manually via workflow_dispatch to (re)build a release
# for an existing tag, e.g. when the Auto Release workflow failed after the
# tag was already pushed.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v2.0.15)"
        required: true
        type: string
      release_notes_pr:
        description: "Optional release PR number to copy release notes from"
        required: false
        type: string

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate tag input
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "::error::Invalid tag '$TAG'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Unshallow
        run: git fetch --prune --unshallow

      # Cross-compiling the provider for all targets exhausts the default
      # runner resources, which shows up as "The runner has received a
      # shutdown signal" mid-build. Free disk space and add swap headroom.
      - name: Prepare runner for build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /swapfile-release
          sudo chmod 600 /swapfile-release
          sudo mkswap /swapfile-release
          sudo swapon /swapfile-release
          free -h
          df -h /

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@01dd5d3ca463c7f10f7f4f7b4f177225ac661ee4 # v6.1.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: latest
          args: release --clean --parallelism 1
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}

      - name: Attach release notes
        if: github.event_name == 'workflow_dispatch' && inputs.release_notes_pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ inputs.release_notes_pr }}
        run: |
          gh pr view "$PR_NUMBER" --json body -q '.body' | \
            sed -n '/<!-- RELEASE_NOTES_START -->/,/<!-- RELEASE_NOTES_END -->/p' | \
            sed '1d;$d' > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::warning::No release notes found in PR #$PR_NUMBER body"
            echo "## Release $TAG" > release-notes.md
          fi

          gh release edit "$TAG" --notes-file release-notes.md
